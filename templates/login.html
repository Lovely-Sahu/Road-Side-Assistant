{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card glass"><p class="eyebrow">RSA NETWORK</p><h1>Welcome back.</h1><p>Sign in to continue to your roadside workspace.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" required autocomplete="username" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="btn primary big" type="submit">Sign in →</button></form><p class="muted">New to RSA? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
